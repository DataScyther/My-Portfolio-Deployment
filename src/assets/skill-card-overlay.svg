<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skillGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
    </linearGradient>
    <pattern id="skillCardPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="60" height="60" fill="url(#skillGradient)"/>
      <circle cx="10" cy="10" r="1" fill="currentColor" opacity="0.15"/>
      <circle cx="30" cy="30" r="1" fill="currentColor" opacity="0.15"/>
      <circle cx="50" cy="50" r="1" fill="currentColor" opacity="0.15"/>
      <circle cx="50" cy="10" r="1" fill="currentColor" opacity="0.15"/>
      <circle cx="10" cy="50" r="1" fill="currentColor" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#skillCardPattern)"/>
</svg>
