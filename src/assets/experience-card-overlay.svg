<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="expGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
    </linearGradient>
    <pattern id="expCardPattern" width="120" height="120" patternUnits="userSpaceOnUse">
      <!-- Data flow lines -->
      <path d="M10 60 H110" stroke="currentColor" stroke-width="0.5" fill="none" opacity="0.1" stroke-dasharray="2,8"/>
      <path d="M60 10 V110" stroke="currentColor" stroke-width="0.5" fill="none" opacity="0.1" stroke-dasharray="2,8"/>
      <path d="M30 30 L90 90" stroke="currentColor" stroke-width="0.5" fill="none" opacity="0.1" stroke-dasharray="2,8"/>
      <path d="M30 90 L90 30" stroke="currentColor" stroke-width="0.5" fill="none" opacity="0.1" stroke-dasharray="2,8"/>
      
      <!-- Connection nodes -->
      <circle cx="60" cy="60" r="2" fill="currentColor" opacity="0.15"/>
      <circle cx="30" cy="30" r="1.5" fill="currentColor" opacity="0.15"/>
      <circle cx="90" cy="30" r="1.5" fill="currentColor" opacity="0.15"/>
      <circle cx="30" cy="90" r="1.5" fill="currentColor" opacity="0.15"/>
      <circle cx="90" cy="90" r="1.5" fill="currentColor" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#expCardPattern)"/>
</svg>
