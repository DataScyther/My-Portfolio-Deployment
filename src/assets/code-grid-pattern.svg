<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="codeGridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <!-- Code bracket symbols -->
      <path d="M15 15 L10 30 L15 45" stroke="currentColor" stroke-width="1" fill="none" opacity="0.15"/>
      <path d="M45 15 L50 30 L45 45" stroke="currentColor" stroke-width="1" fill="none" opacity="0.15"/>
      
      <!-- Grid dots -->
      <circle cx="10" cy="10" r="1" fill="currentColor" opacity="0.12"/>
      <circle cx="20" cy="10" r="1" fill="currentColor" opacity="0.12"/>
      <circle cx="30" cy="10" r="1" fill="currentColor" opacity="0.12"/>
      <circle cx="40" cy="10" r="1" fill="currentColor" opacity="0.12"/>
      <circle cx="50" cy="10" r="1" fill="currentColor" opacity="0.12"/>
      
      <circle cx="10" cy="20" r="1" fill="currentColor" opacity="0.12"/>
      <circle cx="30" cy="20" r="1" fill="currentColor" opacity="0.12"/>
      <circle cx="50" cy="20" r="1" fill="currentColor" opacity="0.12"/>
      
      <circle cx="10" cy="30" r="1" fill="currentColor" opacity="0.12"/>
      <circle cx="30" cy="30" r="1" fill="currentColor" opacity="0.12"/>
      <circle cx="50" cy="30" r="1" fill="currentColor" opacity="0.12"/>
      
      <circle cx="10" cy="40" r="1" fill="currentColor" opacity="0.12"/>
      <circle cx="30" cy="40" r="1" fill="currentColor" opacity="0.12"/>
      <circle cx="50" cy="40" r="1" fill="currentColor" opacity="0.12"/>
      
      <circle cx="10" cy="50" r="1" fill="currentColor" opacity="0.12"/>
      <circle cx="20" cy="50" r="1" fill="currentColor" opacity="0.12"/>
      <circle cx="30" cy="50" r="1" fill="currentColor" opacity="0.12"/>
      <circle cx="40" cy="50" r="1" fill="currentColor" opacity="0.12"/>
      <circle cx="50" cy="50" r="1" fill="currentColor" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#codeGridPattern)"/>
</svg>
